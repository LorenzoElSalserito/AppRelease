name: Publish package repository

# Rebuilds the whole APT/DNF repository from every published GitHub Release and
# deploys it to GitHub Pages. The build is idempotent: it always starts from the
# full set of release assets, so publishing, editing or deleting a release keeps
# the repository consistent.

on:
  release:
    types: [published, edited, released, deleted, unpublished]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you rebuilding? (free text, optional)"
        required: false
        default: "manual rebuild"

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer build supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build signed repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils createrepo-c rpm gnupg xz-utils rclone

      - name: Download assets from every published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets

          # Drafts have no public assets; skip them. Pre-releases are included so
          # that beta packages are still installable.
          tags=$(gh release list --limit 500 --json tagName,isDraft \
                 --jq '.[] | select(.isDraft == false) | .tagName')

          if [ -z "$tags" ]; then
            echo "No published releases found — the site will be built empty."
            exit 0
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "::group::Downloading assets for $tag"
            mkdir -p "assets/$tag"
            # `|| true` keeps releases without matching assets from failing the run.
            gh release download "$tag" --dir "assets/$tag" --clobber \
              --pattern '*' || echo "No downloadable assets for $tag"
            echo "::endgroup::"
          done <<< "$tags"

          find assets -type f | sort

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY is missing. See manual_operations.md."
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          # The passphrase, when present, is written to a 0600 file inside the
          # ephemeral runner workspace so that gpg and rpmsign can both read it
          # without it ever appearing in a command line or in the logs.
          pass_file="${RUNNER_TEMP}/gpg-passphrase"
          : > "$pass_file"
          chmod 600 "$pass_file"
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf '%s' "$GPG_PASSPHRASE" > "$pass_file"
          fi

          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import

          key_id=$(gpg --list-secret-keys --with-colons \
                   | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$key_id" ]; then
            echo "::error::No secret key found after import. Is GPG_PRIVATE_KEY a full ASCII-armored private key?"
            exit 1
          fi
          echo "Imported key $key_id"

          # Mark the key ultimately trusted so that rpmsign/createrepo do not stall.
          printf '%s:6:\n' "$key_id" | gpg --batch --import-ownertrust

          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "GPG_KEY_ID=$key_id"
            echo "GPG_PASSPHRASE_FILE=$pass_file"
          } >> "$GITHUB_ENV"

      - name: Check package storage configuration
        env:
          PKG_BASE_URL: ${{ vars.PKG_BASE_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for v in PKG_BASE_URL R2_BUCKET R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing package storage configuration:$missing — see manual_operations.md §8c."
            exit 1
          fi
          echo "Package storage: $PKG_BASE_URL (bucket $R2_BUCKET)"

      - name: Compute public base URL
        id: site
        env:
          SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${SLUG%%/*}"
          repo="${SLUG#*/}"
          owner_lc=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')
          repo_lc=$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')

          # A repository literally named <owner>.github.io is served from the
          # domain root; every other repository is served from a subpath that
          # keeps the repository name's original casing.
          if [ "$repo_lc" = "${owner_lc}.github.io" ]; then
            url="https://${owner_lc}.github.io"
          else
            url="https://${owner_lc}.github.io/${repo}"
          fi

          {
            echo "url=$url"
            echo "name=$repo"
          } >> "$GITHUB_OUTPUT"
          echo "Base URL: $url"

      - name: Build signed APT + DNF repository
        env:
          ASSETS_DIR: assets
          SITE_DIR: _site
          BASE_URL: ${{ steps.site.outputs.url }}
          PKG_BASE_URL: ${{ vars.PKG_BASE_URL }}
          RELEASES_BASE_URL: https://github.com/${{ github.repository }}/releases/download
          REPO_NAME: ${{ steps.site.outputs.name }}
          APT_SUITE: stable
          APT_COMPONENT: main
        run: ./scripts/build-repo.sh

      - name: Verify signatures
        run: |
          set -euo pipefail

          if [ -f _site/deb/dists/stable/InRelease ]; then
            gpg --verify _site/deb/dists/stable/InRelease
            gpg --verify _site/deb/dists/stable/Release.gpg _site/deb/dists/stable/Release
            echo "APT signatures: OK"
          fi

          if compgen -G "_site/rpm/*.rpm" > /dev/null; then
            gpg --verify _site/rpm/repodata/repomd.xml.asc _site/rpm/repodata/repomd.xml
            # Importing the public key into the system rpmdb makes `rpm -K`
            # verify the signature against it instead of reporting NOKEY.
            sudo rpm --import _site/public-key.asc
            for f in _site/rpm/*.rpm; do
              sudo rpm -K "$f"
            done
            echo "RPM signatures: OK"
          fi

      - name: Publish packages to Cloudflare R2
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          # rclone reads its whole configuration from these variables, so no
          # credentials are ever written to a config file on the runner.
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2 buckets live in a single virtual region and are private by
          # construction: it implements no S3 ACLs, so sending an `acl` value
          # makes every upload fail with `501 Not Implemented`.
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail

          # `--checksum` compares content, not timestamps. The site is rebuilt
          # from scratch on every run, so every local file looks new; without
          # this flag each release would re-upload the entire repository.
          common=(--checksum --transfers 8 --s3-chunk-size 64M
                  --stats 30s --stats-one-line --retries 3)

          # 1. Upload packages first, with `copy`, so nothing is ever removed
          #    while an index that still references it is live.
          echo "::group::Uploading packages"
          rclone copy _site/deb/pool "r2:${R2_BUCKET}/deb/pool"   "${common[@]}"
          rclone copy _site/rpm      "r2:${R2_BUCKET}/rpm"        "${common[@]}" --exclude '/repodata/**'
          # `files/` only exists when RELEASES_BASE_URL is unset; normally the
          # non-package assets are linked straight to the GitHub release.
          if [ -d _site/files ]; then
            rclone copy _site/files "r2:${R2_BUCKET}/files" "${common[@]}"
          fi
          echo "::endgroup::"

          # 2. Then the freshly signed indexes. `--ignore-times` forces the
          #    upload: these files are small and must never be stale.
          echo "::group::Uploading indexes"
          if [ -d _site/deb/dists ]; then
            rclone sync _site/deb/dists "r2:${R2_BUCKET}/deb/dists" --ignore-times --retries 3
          fi
          if [ -d _site/rpm/repodata ]; then
            rclone sync _site/rpm/repodata "r2:${R2_BUCKET}/rpm/repodata" --ignore-times --retries 3
          fi
          echo "::endgroup::"

          # 3. Only now prune packages that no release carries any more.
          echo "::group::Pruning withdrawn packages"
          rclone sync _site/deb/pool "r2:${R2_BUCKET}/deb/pool" "${common[@]}"
          rclone sync _site/rpm      "r2:${R2_BUCKET}/rpm"      "${common[@]}" --exclude '/repodata/**'
          if [ -d _site/files ]; then
            rclone sync _site/files "r2:${R2_BUCKET}/files" "${common[@]}"
          fi
          echo "::endgroup::"

          # The heavy trees now live on R2; GitHub Pages keeps only the landing
          # page, the public key and the client configuration files, which are a
          # few kilobytes in total and stay well inside the 1 GB Pages limit.
          rm -rf _site/deb _site/rpm _site/files
          echo "Left for GitHub Pages: $(du -sh _site | cut -f1)"

      - name: Wipe signing material from the runner
        if: always()
        run: |
          GNUPGHOME="${RUNNER_TEMP}/gnupg" gpgconf --kill gpg-agent >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP}/gnupg" "${RUNNER_TEMP}/gpg-passphrase" || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
